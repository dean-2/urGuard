syntax = "proto3";

package urguard.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/dean-2/urGuard/backend/gen/urguard/v1;urguardv1";

service TelemetryService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc VerifyAuditChain(VerifyAuditChainRequest) returns (VerifyAuditChainResponse);
  rpc IngestAccessEvents(IngestAccessEventsRequest) returns (IngestAccessEventsResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  rpc StreamAlerts(StreamAlertsRequest) returns (stream StreamAlertsResponse);
  rpc GetDetectionMetrics(GetDetectionMetricsRequest) returns (GetDetectionMetricsResponse);
  rpc GetAccessGraph(GetAccessGraphRequest) returns (GetAccessGraphResponse);
}

message AuditEvent {
  uint64 seq = 1;
  bytes prev_hash = 2;
  bytes canonical_body = 3;
  bytes entry_hash = 4;
  string actor_id = 5;
  string action = 6;
  google.protobuf.Timestamp timestamp = 7;
  string user_text = 8;
}

message AccessEvent {
  string event_id = 1;
  string identity = 2;
  string role = 3;
  string action = 4;
  string source_service = 5;
  string target_service = 6;
  string source_node = 7;
  string change_ticket = 8;
  string maintenance_window_id = 9;
  google.protobuf.Timestamp event_timestamp = 10;
  google.protobuf.Timestamp ingest_timestamp = 11;
  string target_identity = 12;
}

message EventOrdering {
  repeated string event_ids = 1;
}

message Alert {
  string alert_id = 1;
  string identity = 2;
  repeated string services = 3;
  repeated string event_ids = 4;
  string path_or_rule = 5;
  string explanation = 6;
  double confidence_score = 7;
  bool order_uncertain = 8;
  bool late_arrival = 9;
  repeated EventOrdering possible_orderings = 10;
  google.protobuf.Timestamp detected_at = 11;
}

message AccessEdge {
  string identity = 1;
  string source_service = 2;
  string target_service = 3;
  uint64 observed_count = 4;
  uint64 baseline_count = 5;
}

message ListAuditEventsRequest {
  uint64 from_seq = 1;
  uint32 limit = 2;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  uint64 next_seq = 2;
}

message VerifyAuditChainRequest {}

message VerifyAuditChainResponse {
  bool valid = 1;
  uint64 checked_events = 2;
  uint64 checked_checkpoints = 3;
  optional uint64 broken_seq = 4;
  string reason = 5;
}

message IngestAccessEventsRequest {
  repeated AccessEvent events = 1;
}

message IngestAccessEventsResponse {
  uint64 accepted = 1;
}

message ListAlertsRequest {
  string page_token = 1;
  uint32 page_size = 2;
}

message ListAlertsResponse {
  repeated Alert alerts = 1;
  string next_page_token = 2;
}

message StreamAlertsRequest {
  string after_alert_id = 1;
}

message StreamAlertsResponse {
  Alert alert = 1;
}

message GetDetectionMetricsRequest {}

message GetDetectionMetricsResponse {
  double precision = 1;
  double recall = 2;
  double f1 = 3;
  double median_time_to_alert_ms = 4;
  double false_alerts_per_1000_benign = 5;
}

message GetAccessGraphRequest {}

message GetAccessGraphResponse {
  repeated AccessEdge edges = 1;
}
