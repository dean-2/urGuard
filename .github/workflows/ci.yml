name: CI

on:
  push:
    branches: [main, frontend, backend]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-and-secrets:
    name: Secret & Zero-AI Policy Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify zero AI/ML dependencies
        run: bash scripts/check-no-ai-deps.sh

  frontend:
    name: Frontend Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Build, Vet & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true

      - name: Build, vet, and test backend
        run: |
          if [ -f backend/go.mod ]; then
            cd backend
            go build ./...
            go vet ./...
            go test -race ./...
          else
            echo "backend/go.mod not present yet; skipping Go checks."
          fi

  docker:
    name: Docker Compose & Image Build
    runs-on: ubuntu-latest
    needs: [policy-and-secrets, frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Validate Compose configuration
        run: docker compose -f deployments/docker-compose.yml config -q

      - name: Build containers
        run: |
          if [ -f backend/go.mod ]; then
            docker compose -f deployments/docker-compose.yml build
          else
            docker build -f deployments/frontend.Dockerfile --build-arg VITE_USE_MOCKS=true -t urguard-frontend:ci .
          fi
