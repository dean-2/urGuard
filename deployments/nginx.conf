server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy ConnectRPC and console API calls to the Go control plane over internal mTLS.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $controlplane_upstream https://controlplane:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $controlplane_upstream;

        proxy_ssl_certificate /etc/nginx/certs/admin.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/admin.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name controlplane;
        proxy_ssl_protocols TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
