server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy ConnectRPC, gRPC-Web, and server-streaming calls to the Go control plane.
    # Uses a variable upstream so Nginx starts cleanly even before controlplane is running.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $controlplane_upstream http://controlplane:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $controlplane_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
